<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da API de Mídia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Teste da API de Mídia - Biblioteca de Mídia</h1>
    
    <div id="results"></div>
    
    <button onclick="testTags()">Testar Tags</button>
    <button onclick="testFolders()">Testar Pastas</button>
    <button onclick="testFiles()">Testar Arquivos</button>
    <button onclick="testProfile()">Testar Perfil</button>
    <button onclick="runAllTests()">Executar Todos os Testes</button>
    <button onclick="clearResults()">Limpar Resultados</button>

    <script>
        const API_BASE = '/api/v1/media';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                return { success: response.ok, status: response.status, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function testTags() {
            addResult('<h3>🏷️ Testando Tags</h3>');
            
            const result = await makeRequest(`${API_BASE}/tags/`);
            
            if (result.success) {
                addResult(`✅ Tags carregadas com sucesso! Encontradas ${result.data.results?.length || result.data.length || 0} tags`, 'success');
                if (result.data.results?.length > 0 || result.data.length > 0) {
                    const tags = result.data.results || result.data;
                    addResult(`<pre>${JSON.stringify(tags.slice(0, 3), null, 2)}</pre>`, 'info');
                }
            } else {
                addResult(`❌ Erro ao carregar tags: ${result.error || result.data?.detail || 'Erro desconhecido'}`, 'error');
                addResult(`Status: ${result.status}`, 'error');
            }
        }
        
        async function testFolders() {
            addResult('<h3>📁 Testando Pastas</h3>');
            
            const result = await makeRequest(`${API_BASE}/folders/`);
            
            if (result.success) {
                addResult(`✅ Pastas carregadas com sucesso! Encontradas ${result.data.results?.length || result.data.length || 0} pastas`, 'success');
                if (result.data.results?.length > 0 || result.data.length > 0) {
                    const folders = result.data.results || result.data;
                    addResult(`<pre>${JSON.stringify(folders.slice(0, 3), null, 2)}</pre>`, 'info');
                }
            } else {
                addResult(`❌ Erro ao carregar pastas: ${result.error || result.data?.detail || 'Erro desconhecido'}`, 'error');
                addResult(`Status: ${result.status}`, 'error');
            }
        }
        
        async function testFiles() {
            addResult('<h3>📄 Testando Arquivos</h3>');
            
            const result = await makeRequest(`${API_BASE}/files/`);
            
            if (result.success) {
                addResult(`✅ Arquivos carregados com sucesso! Encontrados ${result.data.results?.length || result.data.length || 0} arquivos`, 'success');
                if (result.data.results?.length > 0 || result.data.length > 0) {
                    const files = result.data.results || result.data;
                    addResult(`<pre>${JSON.stringify(files.slice(0, 2), null, 2)}</pre>`, 'info');
                }
            } else {
                addResult(`❌ Erro ao carregar arquivos: ${result.error || result.data?.detail || 'Erro desconhecido'}`, 'error');
                addResult(`Status: ${result.status}`, 'error');
            }
        }
        
        async function testProfile() {
            addResult('<h3>👤 Testando Perfil do Usuário</h3>');
            
            const result = await makeRequest(`${API_BASE}/profile/`);
            
            if (result.success) {
                addResult(`✅ Perfil carregado com sucesso!`, 'success');
                addResult(`<pre>${JSON.stringify(result.data, null, 2)}</pre>`, 'info');
            } else {
                addResult(`❌ Erro ao carregar perfil: ${result.error || result.data?.detail || 'Erro desconhecido'}`, 'error');
                addResult(`Status: ${result.status}`, 'error');
            }
        }
        
        async function runAllTests() {
            clearResults();
            addResult('<h2>🚀 Executando Todos os Testes da API de Mídia</h2>');
            
            await testTags();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testFolders();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testFiles();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testProfile();
            
            addResult('<h3>✨ Testes Concluídos!</h3>', 'success');
        }
        
        // Executar testes automaticamente ao carregar a página
        window.addEventListener('load', () => {
            addResult('<h2>📋 Página de Teste da API de Mídia Carregada</h2>');
            addResult('Clique nos botões acima para testar diferentes endpoints da API.', 'info');
        });
    </script>
</body>
</html>
