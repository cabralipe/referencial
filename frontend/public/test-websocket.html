<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste WebSocket</title>
</head>
<body>
    <h1>Teste de Conexão WebSocket</h1>
    <div id="status">Conectando...</div>
    <div id="messages"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function addMessage(message) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            messagesDiv.appendChild(div);
        }

        // Teste de conexão WebSocket
        const wsUrl = 'ws://localhost:8001/ws/media-library/';
        addMessage('Tentando conectar ao: ' + wsUrl);
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = function(event) {
            statusDiv.textContent = 'Conectado!';
            statusDiv.style.color = 'green';
            addMessage('✅ Conectado ao WebSocket');
        };
        
        ws.onmessage = function(event) {
            addMessage('📨 Mensagem recebida: ' + event.data);
        };
        
        ws.onclose = function(event) {
            statusDiv.textContent = 'Desconectado';
            statusDiv.style.color = 'red';
            addMessage('❌ Conexão fechada. Código: ' + event.code + ', Razão: ' + event.reason);
        };
        
        ws.onerror = function(error) {
            statusDiv.textContent = 'Erro na conexão';
            statusDiv.style.color = 'red';
            addMessage('💥 Erro: ' + error);
        };
    </script>
</body>
</html>
