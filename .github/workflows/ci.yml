name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      REFERENCIAL_SECRET_KEY: test-secret
      REFERENCIAL_DATABASE_URL: sqlite:///./test.db
      REFERENCIAL_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: refer_db
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: refer_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refer_user -d refer_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        env:
          REFERENCIAL_DATABASE_URL: postgresql://refer_user:postgres@localhost:5432/refer_db
        run: |
          pytest --cov=.
